name: Test Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create example dataset
      run: |
        python scripts/create_example_dataset.py
    
    - name: Run smoke test
      run: |
        python tests/smoke_test.py
    
    - name: Test CLI help
      run: |
        python main.py --help
        python main.py image --help
        python main.py extract-motion --help
        python main.py svd --help
        python main.py tts --help
        python main.py wav2lip --help
        python main.py post --help
        python main.py assemble --help
        python main.py run-all --help
    
    - name: Test config loading
      run: |
        python -c "
        from utils.config import load_config, validate_config, get_default_config
        config = get_default_config()
        validate_config(config)
        print('Config validation passed')
        "
    
    - name: Test logging setup
      run: |
        python -c "
        from utils.logging import setup_logging
        import logging
        setup_logging(verbose=True)
        logger = logging.getLogger(__name__)
        logger.info('Logging test successful')
        "
    
    - name: Test image utilities
      run: |
        python -c "
        import numpy as np
        from utils.crop_to_aspect import crop_to_aspect_ratio, resize_to_resolution
        test_image = np.random.randint(0, 255, (100, 200, 3), dtype=np.uint8)
        cropped = crop_to_aspect_ratio(test_image, 1.0)
        resized = resize_to_resolution(test_image, (50, 100))
        print('Image utilities test passed')
        "
    
    - name: Check code style
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check for TODO/FIXME comments
      run: |
        if grep -r "TODO\|FIXME" . --exclude-dir=.git --exclude-dir=__pycache__; then
          echo "Found TODO/FIXME comments. Please address them before merging."
          exit 1
        fi
